aid: welbehealth
name: WelbeHealth
description: WelbeHealth is a California public benefit company and provider-sponsored health plan operating Programs
    of All-Inclusive Care for the Elderly (PACE). Founded in 2015 and headquartered in Menlo Park, California,
    it is both insurer and care provider for frail seniors who qualify for nursing-home level of care, coordinating
    and paying for all medical, behavioral, pharmacy, home care, rehabilitation, transportation and social
    services through interdisciplinary teams at PACE centers across California including Fresno, Long Beach,
    Los Angeles, Modesto, North Hollywood, Pasadena, Rosemead, Stockton and the Inland Empire, funded by
    capitated Medicare and Medi-Cal payments. In 2022 it became the first PACE organization to convert to
    public benefit company status. API Evangelist finds no public developer program, no API documentation
    and no machine-readable contract on any WelbeHealth-controlled host as of September 2026.
